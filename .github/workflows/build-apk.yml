name: Compilar APK Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar y guardar APK de depuración
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar herramientas Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # El proyecto original no contiene gradlew ni gradle-wrapper.jar.
      # Instalamos una versión explícita de Gradle para poder compilarlo igualmente.
      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v7
        with:
          name: CarView-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
