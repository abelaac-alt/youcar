plugins {
    id 'com.android.application'
}

android {
    namespace 'es.carview.app'
    compileSdk 35

    defaultConfig {
        applicationId 'es.carview.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0-auto-audio'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Android Auto audio integration (not video projection).
dependencies {
    implementation 'androidx.media:media:1.7.1'
}
